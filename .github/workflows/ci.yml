name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Ruff Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Ruff
        run: pip install ruff==0.8.3
      - name: Run Ruff
        run: ruff check .

  test:
    name: Tests with Coverage
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-dev.txt') }}

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests with coverage
        env:
          MONGODB_URI: "mongodb://localhost:27017/test_hrdb"
          MONGODB_DB_NAME: "test_hrdb"
          JWT_SECRET_KEY: "test-secret-key-for-ci"
          WEBHOOK_HMAC_SECRET: "test-hmac-secret-for-ci"
          OUTBOX_POLL_INTERVAL_SECONDS: "9999"
          MOCK_FAILURE_RATE: "0.0"
        run: |
          pytest --cov=app --cov-report=xml --cov-report=term-missing --cov-fail-under=85 -v

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t hr-api:test .
      - name: Build mock downstream image
        run: docker build -t hr-mock:test -f mock_downstream/Dockerfile .
